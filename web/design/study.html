<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SplendoRust — three board studies</title>
<style>
@import url('/node_modules/@fontsource/cormorant-garamond/600.css');
@import url('/node_modules/@fontsource/dm-sans/400.css');
:root{--table:#f1eee6;--paper:#e6e1d4;--ink:#263c39;--line:#cccbbd;--muted:#6e776b;--accent:#9d6746;--shadow:0 3px 5px #273b3314;--white:#c6bda4;--blue:#387497;--green:#58876b;--red:#b35b50;--black:#424951;--gold:#b89443}
*{box-sizing:border-box}body{margin:0;background:var(--table);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button{font:inherit;color:inherit}header{max-width:1040px;margin:auto;padding:28px 30px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:38px;letter-spacing:-1px;margin:0}header p{margin:3px 0 0;font-size:12px;color:var(--muted)}header nav{display:flex;gap:20px;font-size:12px}main{max-width:850px;margin:0 auto;padding:14px 24px}.player{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:15px}.player .who{width:140px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.name{font-size:16px;margin:4px 0}.score{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px}.score small{font:11px Arial;color:var(--muted)}.holdings{display:flex;gap:14px;align-items:center}.holdings span{display:flex;align-items:center;gap:5px;font-size:12px}.gem{background-image:url(/src/assets/gems.webp);background-size:300% 200%;display:inline-block;width:24px;height:25px;flex:none;fill:var(--c);stroke:var(--ink);stroke-width:.8}.nobles{display:flex;justify-content:center;gap:16px;margin:18px 0}.noble{width:125px;height:83px;display:grid;grid-template-columns:40px 1fr;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:10px}.noble b{font:32px 'Cormorant Garamond',Georgia}.noble small{font-size:10px;color:var(--muted)}.noble .study-seal{background-image:url(/src/assets/seals.webp);background-size:300% 100%;display:block;width:31px;height:33px;stroke:var(--accent);fill:none;stroke-width:1.3}.requirements{display:flex;gap:5px;grid-column:1/3;justify-content:flex-end;font-size:10px}.requirements i{height:15px;width:15px;border-radius:50%;color:white;font-style:normal;display:grid;place-items:center;background:var(--c)}.market{display:flex;flex-direction:column;gap:10px}.tier{display:grid;grid-template-columns:42px repeat(4,1fr);gap:12px}.deck{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;background:var(--paper);position:relative}.deck:after{content:'';position:absolute;inset:4px;border:1px solid var(--line)}.deck strong{font:22px 'Cormorant Garamond'}.card{height:122px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}.card .top{position:absolute;top:7px;left:10px;right:8px;display:flex;justify-content:space-between;align-items:start;z-index:1}.points{font:30px 'Cormorant Garamond',Georgia;font-weight:600}.card .gem{width:25px;height:28px}.art{background-image:url(/src/assets/engravings.webp);background-size:300% 200%;background-position:50% 0%;display:block;position:absolute;width:100%;height:78px;top:18px;left:0;color:var(--c);opacity:.52;stroke:currentColor;stroke-width:1;fill:none}.costs{display:flex;gap:6px;position:absolute;bottom:9px;left:10px}.cost{display:flex;align-items:center;gap:3px;font-size:11px}.cost i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block;border:1px solid #0002}.card:hover{transform:translateY(-2px);border-color:var(--ink)}.bank{display:flex;justify-content:center;gap:18px;margin:18px 0 13px}.token{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line),0 5px 8px #0001;display:grid;place-items:center;position:relative}.token:before{content:'';position:absolute;inset:4px;border:1px solid var(--line);border-radius:50%}.token .gem{width:31px;height:33px}.token b{position:absolute;bottom:-5px;right:-5px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;width:20px;height:20px;display:grid;place-items:center}.instruction{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center;font-size:12px;color:var(--muted);padding:10px}.instruction button{padding:9px 18px;background:var(--ink);color:var(--paper);border:0;border-radius:3px}.foot{display:flex;justify-content:space-between;padding:20px 0;font-size:10px;color:var(--muted)}
body[data-theme=midnight]{--table:#152e2b;--paper:#203b38;--ink:#f1e8cd;--line:#4b6256;--muted:#b0bb9d;--accent:#d4b572;--shadow:0 4px 10px #05191666;--white:#e7dfbf;--blue:#5bafc8;--green:#86b080;--red:#d68068;--black:#a1a1b2;--gold:#d8b66a}.midnight .card{background:#1e3234;border-radius:3px}.midnight .card:before{content:'';position:absolute;inset:4px;border:1px solid var(--line)}.midnight .token{background:var(--c);border:2px solid #c3a66e}.midnight .token .gem{stroke:#f5ead2;fill:#203b38}.midnight h1{letter-spacing:2px;font-size:34px}.midnight .points{color:#dfc589}.midnight .art{opacity:.7}
body[data-theme=modern]{--table:#e9e8e2;--paper:#fffdf6;--ink:#252a28;--line:#bfbbb2;--muted:#696c62;--accent:#bd503c;--white:#c6bda4;--blue:#3763b1;--green:#3e8260;--red:#ce5649;--black:#38384b;--gold:#e2b84c}.modern h1,.modern .points,.modern .score,.modern .deck strong,.modern .noble b{font-family:Arial,sans-serif;font-weight:800}.modern .card{border-radius:0;border:0;border-bottom:5px solid var(--c);box-shadow:0 3px 0 #0002}.modern .card .top{top:10px}.modern .art{opacity:.25;stroke-width:3}.modern .token{background:var(--c);border:0;box-shadow:0 4px 0 #0003}.modern .token .gem{fill:var(--paper);stroke:none}.modern .token:before{display:none}.modern .noble{border-radius:0}.modern .player{border-bottom:2px solid var(--ink)}
@media(min-width:1600px){header{max-width:1200px}main{max-width:950px}.card{height:138px}.art{height:95px}.nobles{margin:22px 0}.player{padding:15px 0}.bank{margin:24px 0}.noble{height:88px}}
@media(max-width:600px){header{padding:17px 16px 13px}h1{font-size:30px}header nav{gap:12px;font-size:11px}main{padding:8px 12px}.player .who{width:100px}.player{gap:8px}.name{font-size:13px}.holdings{gap:5px}.holdings span{gap:2px;font-size:10px}.holdings .gem{width:16px;height:18px}.score{font-size:27px}.nobles{gap:9px;margin:12px 0}.noble{width:100px;height:72px;padding:7px}.tier{grid-template-columns:23px repeat(4,minmax(0,1fr));gap:7px}.deck{font-size:10px}.deck strong{font-size:17px}.card{height:111px}.card .top{left:6px;right:5px}.points{font-size:27px}.card .gem{width:19px;height:21px}.art{top:28px;height:56px}.costs{gap:4px;left:6px;bottom:6px;flex-wrap:wrap;right:4px}.cost{gap:2px;font-size:10px}.cost i{width:9px;height:9px}.bank{gap:13px}.token{width:43px;height:43px}.token .gem{width:23px;height:25px}.token b{width:18px;height:18px}.instruction{flex-direction:column;gap:7px;padding:5px}.foot{font-size:9px}.modern .points{font-size:22px}.midnight h1{font-size:25px}}
</style>
<body><header><div><h1>SplendoRust</h1><p>Can you beat the machine?</p></div><nav><span>How to play</span><span>New game ↗</span></nav></header><main><div id="opponent"></div><div class="nobles" id="nobles"></div><div class="market" id="market"></div><div class="bank" id="bank"></div><div class="instruction">Your turn. Take gems, buy a card, or reserve.<button>Take 3 gems</button></div><div id="human"></div><div class="foot"><span>Original tabletop · Standard two-player rules</span><span>Champion E81 · Runs on your device</span></div></main>
<script>
const theme=new URLSearchParams(location.search).get('theme')||'atelier';document.body.dataset.theme=theme;document.body.className=theme;
const colors=['white','blue','green','red','black','gold'];
function gem(c){const positions=['0% 0%','50% 0%','100% 0%','0% 100%','50% 100%','100% 100%'];return `<span class="gem" style="--c:var(--${colors[c]});background-position:${positions[c]}"></span>`}
function holdings(values){return values.map((v,c)=>`<span>${gem(c)}${v}</span>`).join('')}
function player(name,score,values,human){return `<div class="player"><div class="who"><div class="eyebrow">${human?'You · your turn':'The champion'}</div><div class="name">${name}</div></div><div class="holdings">${holdings(values)}</div><div class="score">${score}<small> / 15</small></div></div>`}
document.querySelector('#opponent').innerHTML=player('SplendoRust',8,[2,1,3,0,2],false);document.querySelector('#human').innerHTML=player('Your collection',6,[1,2,0,3,1],true);
document.querySelector('#nobles').innerHTML=[0,1,2].map((v)=>`<div class="noble"><span class="study-seal"></span><div><b>3</b><small> prestige</small></div><div class="requirements"><i style="--c:var(--${colors[v]})">4</i><i style="--c:var(--${colors[v+1]})">4</i></div></div>`).join('');
document.querySelector('#market').innerHTML=[3,2,1].map((tier,r)=>`<div class="tier"><div class="deck"><strong>${'ⅠⅡⅢ'[tier-1]}</strong><span>${[26,21,14][r]}</span></div>${[0,1,2,3].map((s)=>{let c=(r+s)%5;return `<div class="card" style="--c:var(--${colors[c]})"><div class="top"><span class="points">${[5,4,3,4,2,1,2,3,0,1,0,0][r*4+s]}</span>${gem(c)}</div><span class="art"></span><div class="costs">${[1,2,3].map((n)=>`<span class="cost"><i style="--c:var(--${colors[(c+n)%5]})"></i>${tier+n-1}</span>`).join('')}</div></div>`}).join('')}</div>`).join('');
document.querySelector('#bank').innerHTML=colors.map((c,i)=>`<div class="token" style="--c:var(--${c})">${gem(i)}<b>${[3,4,1,2,3,4][i]}</b></div>`).join('');
</script></body></html>
