name: correctness
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      - run: cargo test --workspace --release --locked --all-features
      - run: python3 scripts/check_data.py
      - name: Check out the pinned independent rules reference
        run: |
          git init "$RUNNER_TEMP/splendor-reference"
          git -C "$RUNNER_TEMP/splendor-reference" fetch --depth 1 https://github.com/roeey777/Splendor-AI.git 95f84d2e6e839c0ef09ca97bdc3b3048a792fb0b
          git -C "$RUNNER_TEMP/splendor-reference" checkout --detach FETCH_HEAD
      - name: Test evidence tools and independent rule comparisons
        env:
          SPLENDOR_REFERENCE: ${{ runner.temp }}/splendor-reference
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check full parity command with retained reference state
        run: |
          cargo run --quiet --release --locked --example parity_export -- 2 92000000 1 true true > "$RUNNER_TEMP/reference-cases.jsonl"
          python3 scripts/check_reference.py --reference "$RUNNER_TEMP/splendor-reference" --cases "$RUNNER_TEMP/reference-cases.jsonl" --chains --output "$RUNNER_TEMP/reference-summary.json"
      - run: cargo run --release --locked -- play --agents strong,greedy --seed 42 --check --output game.json
      - run: cargo run --release --locked -- replay game.json
