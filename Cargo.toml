[workspace]
members = ["crates/splendor-core", "crates/splendor-agents", "crates/splendor-arena"]
default-members = ["crates/splendor-arena"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
splendor-core = { path = "crates/splendor-core" }
splendor-agents = { path = "crates/splendor-agents" }
arrayvec = "0.7"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
